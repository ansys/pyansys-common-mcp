[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ansys-common-mcp"
version = "0.2.dev0"
description = "Common Model Context Protocol (MCP) server for PyAnsys libraries"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
authors = [
    { name = "ANSYS, Inc.", email = "pyansys.core@ansys.com" }
]
maintainers = [
    { name = "ANSYS, Inc.", email = "pyansys.core@ansys.com" }
]
keywords = [
    "ansys",
    "mcp",
    "model-context-protocol",
    "ai",
    "assistant",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "mcp>=0.1.0",
    "fastmcp>=0.1.0",
]

[project.optional-dependencies]
tests = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "black>=23.0",
    "isort>=5.12",
    "mypy>=1.0",
    "flake8>=7.0",
    "pre-commit>=3.0",
]
doc = [
    "Sphinx==8.2.3",
    "ansys-sphinx-theme[autoapi]==1.5.3",
    "build>= 0.10.0",
    "flit>=3.8.0",
    "inflect==7.5.0",
    "jupyter_sphinx==0.5.3",
    "numpy==2.2.6",
    "numpydoc==1.8.0",
    "pandas==2.3.3",
    "parse==1.20.2",
    "pypandoc==1.15",
    "pytest-sphinx==0.6.3",
    "regex==2025.7.34",
    "sphinx-autobuild==2024.10.3",
    "sphinx-autodoc-typehints==3.2.0",
    "sphinx-copybutton==0.5.2",
    "sphinx-notfound-page==1.1.0",
    "sphinx-gallery==0.19.0",
    "sphinxcontrib-mermaid>=0.9.2",
]

[project.urls]
Homepage = "https://github.com/ansys-internal/pyansys-common-mcp"
Documentation = "https://github.com/ansys-internal/pyansys-common-mcp#readme"
Repository = "https://github.com/ansys-internal/pyansys-common-mcp"
Issues = "https://github.com/ansys-internal/pyansys-common-mcp/issues"

[project.scripts]
ansys-common-mcp = "ansys.common.mcp.__main__:main"

[tool.flit.module]
name = "ansys.common.mcp"

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
exclude = [
    "^\\.venv/",
    "^venv/",
    "^build/",
    "^dist/",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = [
    "--verbose",
    "--cov=ansys.common.mcp",
    "--cov=pyexample_mcp",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]

[tool.pydocstyle]
convention = "numpy"
add_ignore = ["D100", "D104"]  # Missing docstring in public module/package

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
]

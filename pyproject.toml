[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ansys-common-mcp"
version = "0.2.dev0"
description = "Common Model Context Protocol (MCP) server for PyAnsys libraries"
readme = "README.md"
requires-python = ">=3.10,<4"
license = { file = "LICENSE" }
authors = [
    { name = "ANSYS, Inc.", email = "pyansys.core@ansys.com" }
]
maintainers = [
    { name = "ANSYS, Inc.", email = "pyansys.core@ansys.com" }
]
keywords = [
    "ansys",
    "mcp",
    "model-context-protocol",
    "ai",
    "assistant",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "mcp>=0.1.0",
    "fastmcp>=0.1.0",
]

[project.optional-dependencies]
tests = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "pytest-mock==3.15.1",
]
doc = [
    "Sphinx==8.2.3",
    "ansys-sphinx-theme[autoapi]==1.5.3",
    "build>= 0.10.0",
    "flit>=3.8.0",
    "inflect==7.5.0",
    "jupyter_sphinx==0.5.3",
    "numpy==2.2.6",
    "numpydoc==1.8.0",
    "pandas==2.3.3",
    "parse==1.20.2",
    "pypandoc==1.15",
    "pytest-sphinx==0.6.3",
    "regex==2025.7.34",
    "sphinx-autobuild==2024.10.3",
    "sphinx-autodoc-typehints==3.2.0",
    "sphinx-copybutton==0.5.2",
    "sphinx-notfound-page==1.1.0",
    "sphinx-gallery==0.19.0",
    "sphinxcontrib-mermaid>=0.9.2",
]

[project.urls]
Homepage = "https://github.com/ansys/pyansys-common-mcp"
Documentation = "https://github.com/ansys/pyansys-common-mcp#readme"
Repository = "https://github.com/ansys/pyansys-common-mcp"
Issues = "https://github.com/ansys/pyansys-common-mcp/issues"

[project.scripts]
ansys-common-mcp = "ansys.common.mcp.__main__:main"

[tool.flit.module]
name = "ansys.common.mcp"

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-line-length = "dynamic"
docstring-code-format = true

[tool.ruff.lint]
select = [
#   "E",    # pycodestyle, see https://beta.ruff.rs/docs/rules/#pycodestyle-e-w
    "D",    # pydocstyle, see https://beta.ruff.rs/docs/rules/#pydocstyle-d
#   "F",    # pyflakes, see https://beta.ruff.rs/docs/rules/#pyflakes-f
    "I",    # isort, see https://beta.ruff.rs/docs/rules/#isort-i
#   "N",    # pep8-naming, see https://beta.ruff.rs/docs/rules/#pep8-naming-n
   "PTH",  # flake9-use-pathlib, https://beta.ruff.rs/docs/rules/#flake8-use-pathlib-pth
   "TD",   # flake8-todos, https://docs.astral.sh/ruff/rules/#flake8-todos-td
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["ansys.common.mcp"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
exclude = [
    "^\\.venv/",
    "^venv/",
    "^build/",
    "^dist/",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/__pycache__/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = [
    "--verbose",
    "--cov=ansys.common.mcp",
    "--cov=pyexample_mcp",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]

[tool.pydocstyle]
convention = "numpy"
add_ignore = ["D100", "D104"]  # Missing docstring in public module/package

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
]
